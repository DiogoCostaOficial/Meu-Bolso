name: Keep Supabase Alive

on:
  schedule:
    # Executa todos os dias às 12:00 UTC (09:00 BRT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite execução manual através da interface do GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Erro: As variáveis de ambiente SUPABASE_URL ou SUPABASE_ANON_KEY não estão configuradas nos Secrets do GitHub."
            exit 1
          fi

          # Limpa eventuais espaços e barras duplicadas no final da URL
          URL=$(echo "${{ secrets.SUPABASE_URL }}" | xargs | sed 's/\/$//')
          ANON_KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | xargs)

          echo "Iniciando ping para o Supabase..."
          echo "Tamanho da URL: ${#URL} caracteres"
          echo "Tamanho da chave: ${#ANON_KEY} caracteres"

          # Vamos consultar a tabela 'categories' limitando a 1 registro.
          # Consultar uma tabela é permitido para a Publishable Key (diferente da raiz /rest/v1/ que exige chave secreta).
          echo "Realizando chamada de ping na tabela 'categories'..."
          
          # Se a chave começar com sb_ (nova), enviamos apenas apikey. Caso contrário (legada), enviamos apikey e Authorization.
          if [[ "$ANON_KEY" == sb_* ]]; then
            STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
              -H "apikey: $ANON_KEY" \
              "$URL/rest/v1/categories?select=*&limit=1")
          else
            STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "$URL/rest/v1/categories?select=*&limit=1")
          fi

          echo "Código de Status HTTP (/rest/v1/categories): $STATUS_CODE"

          # Se a tabela categories não existir ou falhar por outro motivo, tenta na tabela de users
          if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 204 ] && [ "$STATUS_CODE" -ne 206 ]; then
            echo "Resposta da primeira tentativa (status $STATUS_CODE):"
            cat response_body.txt
            echo ""
            
            echo "Tentando ping alternativo na tabela 'users'..."
            if [[ "$ANON_KEY" == sb_* ]]; then
              STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
                -H "apikey: $ANON_KEY" \
                "$URL/rest/v1/users?select=*&limit=1")
            else
              STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
                -H "apikey: $ANON_KEY" \
                -H "Authorization: Bearer $ANON_KEY" \
                "$URL/rest/v1/users?select=*&limit=1")
            fi
            echo "Código de Status HTTP (/rest/v1/users): $STATUS_CODE"
          fi

          # Sucesso é 200 (OK), 204 (No Content) ou 206 (Partial Content)
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 204 ] || [ "$STATUS_CODE" -eq 206 ]; then
            echo "Ping realizado com sucesso! O projeto do Supabase continua ativo."
          else
            echo "Erro final. O Supabase retornou:"
            cat response_body.txt
            echo ""
            exit 1
          fi
