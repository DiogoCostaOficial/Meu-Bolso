name: Keep Supabase Alive

on:
  schedule:
    # Executa todos os dias às 12:00 UTC (09:00 BRT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite execução manual através da interface do GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Erro: As variáveis de ambiente SUPABASE_URL ou SUPABASE_ANON_KEY não estão configuradas nos Secrets do GitHub."
            exit 1
          fi

          # Limpa eventuais espaços e barras duplicadas no final da URL
          URL=$(echo "${{ secrets.SUPABASE_URL }}" | xargs | sed 's/\/$//')
          ANON_KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | xargs)

          echo "Iniciando ping para o Supabase..."
          echo "Tamanho da URL: ${#URL} caracteres"
          echo "Tamanho da chave: ${#ANON_KEY} caracteres"

          # Determina se a chave é do tipo novo (sb_publishable_) ou legada (JWT)
          if [[ "$ANON_KEY" == sb_* ]]; then
            echo "Identificada nova Publishable Key (formato sb_*)."
            # Para chaves novas, o header Authorization Bearer não deve conter a chave publicável direta (pois não é um JWT)
            # Usamos apenas o header 'apikey'
            STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
              -H "apikey: $ANON_KEY" \
              "$URL/rest/v1/")
          else
            echo "Identificada chave legada (formato JWT)."
            # Para chaves antigas JWT, enviamos ambos
            STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "$URL/rest/v1/")
          fi

          echo "Código de Status HTTP (/rest/v1/): $STATUS_CODE"

          # Se falhar, tenta outra variação (sem barra no final)
          if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 204 ]; then
            echo "Erro no primeiro teste. Corpo da resposta:"
            cat response_body.txt
            echo ""
            
            echo "Tentando segunda variação (sem barra /rest/v1 e sem Authorization)..."
            STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
              -H "apikey: $ANON_KEY" \
              "$URL/rest/v1")
            echo "Código de Status HTTP (/rest/v1): $STATUS_CODE"
          fi

          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 204 ]; then
            echo "Ping realizado com sucesso! O projeto do Supabase continua ativo."
          else
            echo "Erro final. Corpo da resposta do Supabase:"
            cat response_body.txt
            echo ""
            exit 1
          fi
