name: Keep Supabase Alive

on:
  schedule:
    # Executa todos os dias às 12:00 UTC (09:00 BRT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite execução manual através da interface do GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Erro: As variáveis de ambiente SUPABASE_URL ou SUPABASE_ANON_KEY não estão configuradas nos Secrets do GitHub."
            exit 1
          fi

          # Limpa eventuais espaços e barras duplicadas no final da URL
          URL=$(echo "${{ secrets.SUPABASE_URL }}" | xargs | sed 's/\/$//')
          ANON_KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | xargs)

          echo "Iniciando ping para o Supabase..."
          echo "Tamanho da URL limpa: ${#URL} caracteres"
          echo "Tamanho da ANON_KEY limpa: ${#ANON_KEY} caracteres"

          # Tenta realizar a chamada HTTP GET para a raiz do REST salvando a resposta e o status code
          echo "Testando endpoint /rest/v1/..."
          
          # Executa curl salvando o corpo da resposta em um arquivo temporário e capturando o HTTP Status Code
          HTTP_RESPONSE=$(curl -s -w "%{http_code}" -o response_body.txt \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$URL/rest/v1/")

          echo "Código de Status HTTP (/rest/v1/): $HTTP_RESPONSE"

          if [ "$HTTP_RESPONSE" -eq 200 ] || [ "$HTTP_RESPONSE" -eq 204 ]; then
            echo "Ping realizado com sucesso! O projeto do Supabase continua ativo."
          else
            echo "Resposta de erro do Supabase:"
            cat response_body.txt
            echo ""
            
            # Tenta sem a barra no final
            echo "Tentando endpoint sem a barra (/rest/v1)..."
            HTTP_RESPONSE_2=$(curl -s -w "%{http_code}" -o response_body_2.txt \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "$URL/rest/v1")
            echo "Código de Status HTTP (/rest/v1): $HTTP_RESPONSE_2"
            
            if [ "$HTTP_RESPONSE_2" -eq 200 ] || [ "$HTTP_RESPONSE_2" -eq 204 ]; then
              echo "Ping realizado com sucesso (sem barra no final)!"
            else
              echo "Resposta de erro do Supabase (sem barra no final):"
              cat response_body_2.txt
              echo ""
              
              # Caso ambos falhem, vamos tentar um ping direto no banco usando outro endpoint do postgrest (ex: RPC ou tabela genérica)
              echo "Testando chamada a tabela para ver se RLS/Configuração da raiz está bloqueando..."
              HTTP_RESPONSE_3=$(curl -s -w "%{http_code}" -o response_body_3.txt \
                -H "apikey: $ANON_KEY" \
                -H "Authorization: Bearer $ANON_KEY" \
                "$URL/rest/v1/users?limit=1")
              echo "Código de Status HTTP (/rest/v1/users): $HTTP_RESPONSE_3"
              cat response_body_3.txt
              echo ""
              
              exit 1
            fi
          fi
