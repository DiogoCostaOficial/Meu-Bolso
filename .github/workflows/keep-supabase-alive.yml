name: Keep Supabase Alive

on:
  schedule:
    # Executa todos os dias às 12:00 UTC (09:00 BRT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite execução manual através da interface do GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Engine & Postgres
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Erro: As variáveis de ambiente SUPABASE_URL ou SUPABASE_ANON_KEY não estão configuradas nos Secrets do GitHub."
            exit 1
          fi

          # Limpa eventuais espaços e barras duplicadas no final da URL
          URL=$(echo "${{ secrets.SUPABASE_URL }}" | xargs | sed 's/\/$//')
          ANON_KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | xargs)

          echo "Iniciando ping reforçado para o Supabase..."
          echo "URL: $URL"

          # 1. Consulta desabilitando Cache (Cache-Control: no-cache) para forçar o toque no banco Postgres
          echo "Executando requisição no-cache no REST API..."
          STATUS_CODE=$(curl -s -w "%{http_code}" -o response_body.txt \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            "$URL/rest/v1/categories?select=id&limit=1")

          echo "Código de Status HTTP (No-Cache Query): $STATUS_CODE"

          # 2. Ping adicional no endpoint de Auth (Health check do GoTrue/Auth Engine do Supabase)
          echo "Executando ping de saúde na Engine de Auth (GoTrue)..."
          AUTH_STATUS=$(curl -s -w "%{http_code}" -o /dev/null \
            -H "apikey: $ANON_KEY" \
            "$URL/auth/v1/health")

          echo "Código de Status HTTP (Auth Health): $AUTH_STATUS"

          # Validação dos testes
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 204 ] || [ "$STATUS_CODE" -eq 206 ]; then
            echo "Ping no banco de dados realizado com sucesso! Instância mantida ativa."
          else
            echo "Aviso: Consulta no banco retornou $STATUS_CODE. Corpo da resposta:"
            cat response_body.txt
            echo ""
            
            # Se a consulta REST falhar, verifica se o Auth pelo menos respondeu 200
            if [ "$AUTH_STATUS" -eq 200 ]; then
              echo "A engine do Supabase respondeu ao ping de Auth com sucesso!"
            else
              echo "Erro: Ambas as tentativas falharam."
              exit 1
            fi
          fi
